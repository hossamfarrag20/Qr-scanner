<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKLAND WARRANTY SYSTEM - QR Scanner</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="lion.png">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- CSS Styles -->
  <link rel="stylesheet" href="styles.css">
  <!-- HTML5-QRCode Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- jsQR High Speed Engine Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <div class="background-glow">
    <div class="glow-sphere glow-1"></div>
    <div class="glow-sphere glow-2"></div>
  </div>

  <div class="app-container">
    <!-- Okland Warranty Header -->
    <header class="app-header">
      <div class="logo-box">
        <img src="lion.png" alt="Okland Lion Logo" class="brand-lion">
        <div class="logo-text">
          <h1>OKLAND <span>WARRANTY SYSTEM</span></h1>
          <p>ماسح الـ QR الذكي والتوجيه المباشر للضمان</p>
        </div>
      </div>
    </header>

    <!-- Main Scanner Centered Layout -->
    <main class="main-single-layout">
      <section class="scanner-card glass-card">
        <!-- Scan Method Tabs -->
        <div class="tab-buttons">
          <button class="tab-btn active" id="tabCameraBtn">
            <i class="fa-solid fa-camera"></i> الكاميرا المباشرة
          </button>
          <button class="tab-btn" id="tabUploadBtn">
            <i class="fa-solid fa-file-arrow-up"></i> رفع صورة QR
          </button>
        </div>

        <!-- Camera View -->
        <div class="scan-view" id="cameraView">
          <div class="camera-controls">
            <select id="cameraSelect" class="custom-select">
              <option value="">جاري البحث عن الكاميرات...</option>
            </select>
            <button id="torchBtn" class="icon-btn" title="الفلاش / الإضاءة" disabled>
              <i class="fa-solid fa-bolt"></i>
            </button>
          </div>

          <div class="reader-wrapper">
            <video id="cameraVideo" playsinline autoplay muted style="width:100%; height:100%; object-fit:cover; display:none;"></video>
            <canvas id="scanCanvas" style="display:none;"></canvas>
            <div id="qrReader"></div>
            <div class="scanner-overlay" id="scannerOverlay">
              <div class="scanner-frame">
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
                <div class="scan-line"></div>
              </div>
              <p class="scan-hint">وجه الكاميرا نحو كود الـ QR للتوجيه المباشر</p>
            </div>
          </div>

          <div class="camera-actions">
            <button class="btn btn-primary" id="startCamBtn"><i class="fa-solid fa-play"></i> تشغيل الكاميرا</button>
            <button class="btn btn-danger" id="stopCamBtn" style="display:none;"><i class="fa-solid fa-stop"></i> إيقاف الكاميرا</button>
          </div>
        </div>

        <!-- File Upload View -->
        <div class="scan-view" id="uploadView" style="display: none;">
          <div class="upload-dropzone" id="dropzone">
            <input type="file" id="qrFileInput" accept="image/*" style="display: none;">
            <div class="dropzone-content">
              <div class="upload-icon">
                <i class="fa-solid fa-cloud-arrow-up"></i>
              </div>
              <h3>إسقاط صورة QR هنا أو اضغط للتصفح</h3>
              <p>يدعم صيغ JPG, PNG, WEBP, GIF</p>
              <button class="btn btn-secondary" id="browseFileBtn"><i class="fa-solid fa-folder-open"></i> اختيار ملف صورة</button>
            </div>
          </div>
          <div id="filePreviewBox" class="file-preview-box" style="display: none;">
            <img id="uploadedImgPreview" src="" alt="QR Preview">
            <div class="preview-info">
              <span id="uploadedFileName">image.png</span>
              <button class="btn btn-sm btn-outline-danger" id="clearFileBtn"><i class="fa-solid fa-trash"></i> حذف</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Scan History Accordion / Footer -->
      <section class="glass-card history-section">
        <div class="history-header">
          <h2><i class="fa-solid fa-clock-rotate-left"></i> سجل المسح الأخير (Scan History)</h2>
          <button class="btn btn-sm btn-outline-danger" id="clearHistoryBtn">
            <i class="fa-solid fa-trash-can"></i> تفريغ السجل
          </button>
        </div>
        <div class="history-list-wrapper">
          <div class="history-empty" id="historyEmpty">
            لا يوجد عمليات مسح سابقة حتى الآن.
          </div>
          <div class="history-list" id="historyList" style="display: none;">
            <!-- History items dynamically generated -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Audio elements -->
  <audio id="beepAudio" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
  </audio>

  <!-- Application logic JS -->
  <script src="app.js"></script>
</body>
</html>
